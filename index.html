<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="cogucat.jpg">
  <title>Notion 3D Media Gallery Pro</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ========================================================
       1. FUNDOS ANIMADOS E TEXTURAS
       ======================================================== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 1; 
      background-color: #1a1a1a; 
      transition: background-color 1s ease;
    }

    /* Temas Estáticos (Mesh Gradients) */
    body.bg-aurora .bg-layer {
      background-color: #6d4aff;
      background-image: 
        radial-gradient(at 0% 0%, #d4a5ff 0px, transparent 60%),
        radial-gradient(at 100% 0%, #e0f2fe 0px, transparent 60%),
        radial-gradient(at 100% 100%, #1e3a8a 0px, transparent 60%),
        radial-gradient(at 0% 100%, #8b5cf6 0px, transparent 60%);
    }
    body.bg-sunset .bg-layer {
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 50% 0%, #ff4500 0px, transparent 70%),
        radial-gradient(at 0% 0%, #ff8c00 0px, transparent 60%),
        radial-gradient(at 100% 0%, #dc143c 0px, transparent 60%),
        radial-gradient(at 50% 100%, #000000 0px, transparent 80%);
    }
    body.bg-ocean .bg-layer {
      background-color: #001a33;
      background-image: 
        radial-gradient(at 20% 80%, #008080 0px, transparent 60%),
        radial-gradient(at 80% 20%, #4b0082 0px, transparent 60%),
        radial-gradient(at 0% 0%, #ff7f50 0px, transparent 40%),
        radial-gradient(at 100% 100%, #00ced1 0px, transparent 60%);
    }
    body.bg-forest .bg-layer {
      background-color: #022c22;
      background-image: 
        radial-gradient(at 10% 10%, #047857 0px, transparent 60%),
        radial-gradient(at 90% 90%, #0f766e 0px, transparent 60%),
        radial-gradient(at 50% 50%, #064e3b 0px, transparent 60%),
        radial-gradient(at 80% 20%, #b45309 0px, transparent 30%);
    }

    /* Otimização Absoluta do Fundo Adaptativo */
    body.bg-adaptive .bg-layer {
      background-color: #050505;
    }
    .adaptive-slide {
      position: absolute;
      inset: -30%; /* Vaza além da tela para permitir movimento/escala */
      background-size: cover;
      background-position: center;
      /* O blur agora renderiza super rápido pq a imagem carregada tem só 100px */
      filter: blur(80px) saturate(200%) brightness(0.6);
      transform: scale(1.5) rotate(-10deg) translate3d(0,0,0); /* Distorce e tira do lugar */
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity;
      pointer-events: none;
    }
    .adaptive-slide.active {
      opacity: 1;
    }

    /* Ruído orgânico ESTÁTICO e fotográfico */
    .bg-noise {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; 
      z-index: 2; 
      opacity: 0.35; 
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    /* ========================================================
       2. CONTAINER PRINCIPAL E SLIDERS
       ======================================================== */
    .gallery-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slides-wrapper {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: visible; 
    }

    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      will-change: transform;
    }

    /* ========================================================
       3. ESTRUTURA DO BLOCO 3D E TEXTURAS
       ======================================================== */
    .card-3d-scene {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: grab;
    }
    .card-3d-scene:active { cursor: grabbing; }

    .extrusionContainer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .extrusion-layer {
      position: absolute;
      inset: 0;
      border-radius: 26px; 
      border: 1px solid rgba(255, 255, 255, 0.03);
      transform-style: preserve-3d;
    }

    .back-face {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: #111111; /* Grafite bem escuro */
      /* Textura de metal escovado na traseira */
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 4px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transform: translateZ(-20px); 
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 5px 15px rgba(0,0,0,0.4);
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .glass-frame {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px; 
      border-radius: 26px;
      /* Vidro mais escuro com reflexo e metal escovado fortíssimo */
      background: rgba(25, 25, 25, 0.45);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
      backdrop-filter: blur(35px) saturate(180%);
      -webkit-backdrop-filter: blur(35px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5); /* Profundidade na borda do vidro */
      transform: translateZ(0); 
      transform-style: preserve-3d;
      z-index: 10;
    }

    /* ========================================================
       4. BORDA LUMINOSA (ANTI-PISCADA)
       ======================================================== */
    .glow-mask {
      position: absolute;
      inset: -3px; 
      border-radius: 29px; 
      padding: 3px; 
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transform: translateZ(4px); 
      z-index: 15;
      overflow: hidden;
    }
    
    .glow-spinner {
      position: absolute;
      top: -100%; left: -100%; width: 300%; height: 300%;
      background: conic-gradient(transparent 60%, rgba(255,255,255,0.7) 85%, #ffffff 100%);
      animation: spinLight 3s linear infinite;
      will-change: transform; 
    }

    @keyframes spinLight {
      100% { transform: rotate(360deg); }
    }

    /* CUSTOMIZAÇÃO DE CORES DA BORDA */
    #galleryContainer.border-rgb .glow-spinner {
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    }
    #galleryContainer.border-gold .glow-spinner {
      background: conic-gradient(transparent 60%, #ffd700 75%, #ff8c00 100%);
    }
    #galleryContainer.border-blood .glow-spinner {
      background: conic-gradient(transparent 30%, rgba(255,0,0,0.5) 60%, #ff0000 100%);
    }
    #galleryContainer.border-space .glow-spinner {
      background: conic-gradient(transparent 60%, rgba(0,0,0,0.5) 85%, #000000 100%);
    }
    #galleryContainer.border-wave .glow-spinner {
      background: conic-gradient(transparent 40%, rgba(255,255,255,0.7) 70%, #ffffff 100%);
    }

    /* ========================================================
       5. CONTEÚDO (MÍDIA E PLAYERS)
       ======================================================== */
    .media-content {
      max-width: calc(90vw - 32px);
      max-height: calc(85vh - 32px);
      object-fit: contain;
      border-radius: 12px;
      display: block;
      transform: translateZ(2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 30;
      pointer-events: auto;
      backface-visibility: hidden; 
    }

    .video-wrapper {
      position: relative;
      display: inline-flex;
      transform: translateZ(2px);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .video-wrapper video {
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    
    .pause-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) translateZ(10px) scale(0.8);
      width: 76px; height: 76px;
      background: rgba(15, 15, 15, 0.4);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      color: white; opacity: 0; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .video-paused .pause-overlay {
      opacity: 1;
      transform: translate(-50%, -50%) translateZ(25px) scale(1);
    }

    .video-controls {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateZ(15px);
      width: calc(100% - 48px); max-width: 460px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(40px) saturate(250%);
      -webkit-backdrop-filter: blur(40px) saturate(250%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 30px; 
      display: flex; align-items: center; gap: 16px;
      padding: 10px 18px; z-index: 60; opacity: 0;
      transition: opacity 0.4s, transform 0.4s;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .video-wrapper:hover .video-controls, .video-paused .video-controls {
      opacity: 1; transform: translateX(-50%) translateZ(35px);
    }
    .control-btn {
      background: none; border: none; color: rgba(255, 255, 255, 0.85);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, transform 0.2s; padding: 0;
    }
    .control-btn:hover { color: #fff; transform: scale(1.1); }
    .progress-bar-container { flex: 1; display: flex; align-items: center; }
    .volume-container { display: flex; align-items: center; gap: 10px; width: 90px; }

    .glass-slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.15); border-radius: 4px;
      outline: none; cursor: pointer; transition: height 0.2s;
    }
    .glass-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: transform 0.2s; transform: scale(0); 
    }
    .glass-slider:hover::-webkit-slider-thumb, .glass-slider:active::-webkit-slider-thumb { transform: scale(1); }

    /* ========================================================
       6. MENUS, BOTÕES E MODAIS
       ======================================================== */
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; cursor: pointer; opacity: 0.2; transition: all 0.3s; z-index: 50;
    }
    .gallery-container:hover .nav-btn { opacity: 0.8; }
    .nav-btn:hover { opacity: 1 !important; background: rgba(255, 255, 255, 0.15); transform: translateY(-50%) scale(1.1); }
    .prev-btn { left: 24px; } .next-btn { right: 24px; }

    .dots-container {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 50;
      padding: 8px 16px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); border-radius: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: all 0.4s; }
    .dot.active { width: 24px; border-radius: 10px; background: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }

    .menu-trigger, .custom-trigger {
      position: absolute; top: 24px; 
      width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.6); cursor: pointer; opacity: 0.3; transition: all 0.3s; z-index: 60;
    }
    .menu-trigger { right: 24px; }
    .custom-trigger { right: 76px; }
    
    .gallery-container:hover .menu-trigger, .menu-trigger:hover, 
    .gallery-container:hover .custom-trigger, .custom-trigger:hover {
      opacity: 1; color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    
    .modal-content {
      width: 440px; 
      background: rgba(18, 18, 18, 0.95); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 20px;
      padding: 24px; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
    .close-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    
    .upload-zone { 
      border: 1px dashed rgba(255, 255, 255, 0.15); 
      border-radius: 12px; 
      padding: 20px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s; 
      background: rgba(255,255,255,0.02);
    }
    .upload-zone:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.4); }
    
    .lists-container {
       max-height: 260px;
       overflow-y: auto;
       padding-right: 8px;
       display: flex;
       flex-direction: column;
       gap: 16px;
    }
    .lists-container::-webkit-scrollbar { width: 4px; }
    .lists-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .modal-list-section h4 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #777;
        margin-bottom: 8px;
        font-weight: 600;
    }
    .media-list { display: flex; flex-direction: column; gap: 6px; }
    .media-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
    .media-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: #000; }
    .media-info { flex: 1; font-size: 13px; color: #ccc; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .delete-btn { background: none; border: none; color: #ff4444; padding: 6px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
    .delete-btn:hover { background: rgba(255,0,0,0.1); border-radius: 6px; opacity: 1; }

    .custom-section { margin-bottom: 20px; }
    .custom-section h4 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 500; }
    .custom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .custom-btn {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; color: #ccc; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .custom-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .custom-btn.active { background: #fff; color: #000; font-weight: 600; box-shadow: 0 0 10px rgba(255,255,255,0.5); border-color: #fff; }
  </style>
</head>
<body>

  <!-- Estrutura HMTL Principal -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-noise"></div>

  <div class="gallery-container border-default" id="galleryContainer">
    
    <div class="controls-hit-area">
      <div class="custom-trigger" id="openCustomBtn" title="Aparência">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
      </div>
      <div class="menu-trigger" id="openModalBtn" title="Gerenciar Mídias">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1 z"></path></svg>
      </div>
    </div>

    <div class="nav-btn prev-btn" id="prevBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
    <div class="nav-btn next-btn" id="nextBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>

    <div class="slides-wrapper" id="slidesWrapper"></div>
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-weight: 500; font-size: 16px;">Gerenciar Mídias</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="upload-zone" id="uploadDropzone">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none;" />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 8px auto; color: #888;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p style="font-size: 13px; color: #aaa;">Clique ou arraste novos arquivos</p>
      </div>
      <div class="lists-container">
          <div class="modal-list-section" id="section-images" style="display: none;">
             <h4>Imagens</h4><div class="media-list" id="list-images-content"></div>
          </div>
          <div class="modal-list-section" id="section-gifs" style="display: none;">
             <h4>GIFs</h4><div class="media-list" id="list-gifs-content"></div>
          </div>
          <div class="modal-list-section" id="section-videos" style="display: none;">
             <h4>Vídeos</h4><div class="media-list" id="list-videos-content"></div>
          </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalCustom">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-weight: 500; font-size: 16px;">Personalizar Aparência</h3>
        <button class="close-btn" id="closeCustomBtn">&times;</button>
      </div>
      <div class="custom-section">
        <h4>Fundos Animados</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBg('default', this)">Escuro</button>
          <button class="custom-btn" onclick="setBg('adaptive', this)">Dinâmico</button>
          <button class="custom-btn" onclick="setBg('aurora', this)">Aurora</button>
          <button class="custom-btn" onclick="setBg('sunset', this)">Pôr do Sol</button>
          <button class="custom-btn" onclick="setBg('ocean', this)">Oceano</button>
          <button class="custom-btn" onclick="setBg('forest', this)">Floresta</button>
        </div>
      </div>
      <div class="custom-section">
        <h4>Cor da Borda de Luz</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBorder('default', this)">Branco</button>
          <button class="custom-btn" onclick="setBorder('rgb', this)">RGB</button>
          <button class="custom-btn" onclick="setBorder('gold', this)">Ouro</button>
          <button class="custom-btn" onclick="setBorder('blood', this)">Sangue</button>
          <button class="custom-btn" onclick="setBorder('space', this)">Espaço</button>
          <button class="custom-btn" onclick="setBorder('wave', this)">Ondas</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_NAME = 'NotionSuperGalleryDB_Pro';
    const DB_VERSION = 1;
    const STORE_NAME = 'media';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains(STORE_NAME)) {
            e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveMediaItem(file) {
      const db = await initDB();
      const type = file.type.startsWith('video') ? 'video' : 'image';
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add({ name: file.name, type: type, blob: file, ts: Date.now() });
        tx.oncomplete = () => resolve();
      });
    }

    async function getAllMedia() {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function deleteMediaItem(id) {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    const thumbCache = {};
    
    // Gera miniaturas super leves para o Fundo Dinâmico (Anti-engasgo)
    function generateThumb(item) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(item.blob);
            if (item.type === 'image') {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; // Resolução minúscula para blur instantâneo
                    canvas.height = 100 * (img.height / img.width);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL());
                    URL.revokeObjectURL(url);
                }
                img.onerror = () => resolve('');
            } else {
                // Captura 1 segundo do vídeo para cor sólida
                const video = document.createElement('video');
                video.src = url;
                video.muted = true;
                video.currentTime = 1; 
                video.onloadeddata = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100;
                    canvas.height = 100 * (video.videoHeight / video.videoWidth);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL());
                    URL.revokeObjectURL(url);
                };
                video.onerror = () => resolve('');
            }
        });
    }

    let items = [], activeURLs = [];
    const wrapper = document.getElementById('slidesWrapper');
    const dotsContainer = document.getElementById('dotsContainer');
    const bgLayer = document.getElementById('bgLayer');
    
    let virtualIndex = 0; 
    let cameraX = 0;      
    let lastActiveIndex = -1; 
    
    async function loadGallery() {
      activeURLs.forEach(u => URL.revokeObjectURL(u));
      activeURLs.length = 0;
      items = await getAllMedia();

      // Pré-gerar thumbs de tudo para a memória
      for (const item of items) {
          if (!thumbCache[item.id]) {
              thumbCache[item.id] = await generateThumb(item);
          }
      }

      if (items.length === 0) {
        virtualIndex = 0;
        cameraX = 0;
        wrapper.innerHTML = `<div class="slide"><div class="empty-state" style="padding: 60px 40px; color: rgba(255, 255, 255, 0.6); text-align: center; font-size: 15px;">Sem imagens.<br><span>Clique na engrenagem no topo direito.</span></div></div>`;
      } else {
        virtualIndex = 0;
        cameraX = 0;
        renderAllSlides();
      }
      renderDots();
      renderManageList();
      updateAdaptiveBg(0);
    }

    // Textura da moldura em metal escovado lateral
    function build3DExtrusion(container) {
      container.innerHTML = '';
      const layersCount = 12; // Menos camadas = Mais Performance GPU
      const step = 20 / layersCount; 
      for(let i = 1; i <= layersCount; i++) {
        const layer = document.createElement('div');
        layer.className = 'extrusion-layer';
        layer.style.transform = `translateZ(-${(i * step).toFixed(2)}px)`;
        // Tons escuros para combinar com a nova traseira
        const shade = Math.max(10, 38 - (i * 1.5)); 
        layer.style.background = `rgb(${shade}, ${shade}, ${shade})`;
        container.appendChild(layer);
      }
    }

    function renderAllSlides() {
      wrapper.innerHTML = '';
      items.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        
        const url = URL.createObjectURL(item.blob);
        activeURLs.push(url);

        const cardHtml = `
          <div class="card-3d-scene">
            <div class="extrusionContainer"></div>
            <div class="back-face"></div>
            <div class="glass-frame">
              <div class="glow-mask"><div class="glow-spinner"></div></div>
              <div class="mediaContainer"></div>
            </div>
          </div>
        `;
        slide.innerHTML = cardHtml;
        const mediaContainer = slide.querySelector('.mediaContainer');

        if (item.type === 'video') {
          const vWrap = document.createElement('div');
          vWrap.className = 'video-wrapper';
          
          const video = document.createElement('video');
          video.src = url; video.className = 'media-content'; 
          video.loop = true; video.playsInline = true;
          
          const pauseIcon = document.createElement('div');
          pauseIcon.className = 'pause-overlay';
          pauseIcon.innerHTML = `<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg>`;
          
          const controls = document.createElement('div');
          controls.className = 'video-controls';
          controls.innerHTML = `
            <button class="control-btn play-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
            <div class="progress-bar-container"><input type="range" class="glass-slider progress-slider" min="0" max="100" value="0" /></div>
            <div class="volume-container">
              <button class="control-btn mute-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
              <input type="range" class="glass-slider volume-slider" min="0" max="1" step="0.01" value="1" />
            </div>
          `;

          vWrap.appendChild(video);
          vWrap.appendChild(pauseIcon);
          vWrap.appendChild(controls);

          const playBtn = controls.querySelector('.play-btn');
          const progressSlider = controls.querySelector('.progress-slider');
          const muteBtn = controls.querySelector('.mute-btn');
          const volumeSlider = controls.querySelector('.volume-slider');

          controls.addEventListener('mousedown', (e) => e.stopPropagation());

          const updateSliderBg = (slider, percent) => {
            slider.style.background = `linear-gradient(to right, rgba(255,255,255,0.95) ${percent}%, rgba(255,255,255,0.15) ${percent}%)`;
          };
          updateSliderBg(volumeSlider, 100);

          const togglePlay = () => {
            if (video.paused) { 
              video.play(); vWrap.classList.remove('video-paused'); 
              playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;
            } else { 
              video.pause(); vWrap.classList.add('video-paused'); 
              playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
            }
          };

          vWrap.onclick = (e) => { e.stopPropagation(); togglePlay(); };
          playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };

          video.ontimeupdate = () => {
            if (!video.duration) return;
            const percentage = (video.currentTime / video.duration) * 100;
            progressSlider.value = percentage;
            updateSliderBg(progressSlider, percentage);
          };
          progressSlider.oninput = (e) => {
            if (!video.duration) return;
            video.currentTime = (e.target.value / 100) * video.duration;
            updateSliderBg(progressSlider, e.target.value);
          };

          const updateMuteIcon = () => {
            if (video.muted || video.volume === 0) {
              muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
            } else {
              muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
            }
          };
          volumeSlider.oninput = (e) => {
            video.volume = e.target.value; video.muted = e.target.value === '0';
            updateSliderBg(volumeSlider, e.target.value * 100); updateMuteIcon();
          };
          muteBtn.onclick = (e) => {
            e.stopPropagation(); video.muted = !video.muted;
            if (!video.muted && video.volume === 0) video.volume = 1;
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateSliderBg(volumeSlider, video.muted ? 0 : video.volume * 100); updateMuteIcon();
          };

          mediaContainer.appendChild(vWrap);
        } else {
          const img = document.createElement('img');
          img.src = url; img.className = 'media-content'; img.draggable = false;
          mediaContainer.appendChild(img);
        }

        wrapper.appendChild(slide);
      });

      document.querySelectorAll('.extrusionContainer').forEach(cont => build3DExtrusion(cont));
      lastActiveIndex = -1;
    }

    // Sistema Crossfade que elimina o "engasgo" de renderização da GPU
    function updateAdaptiveBg(idx) {
       if (!document.body.classList.contains('bg-adaptive')) return;
       if (idx < 0 || idx >= items.length) return;
       
       const item = items[idx];
       const thumb = thumbCache[item.id];
       if (!thumb) return;

       // Injeta uma div nova e faz fade suave por cima da velha
       const newBg = document.createElement('div');
       newBg.className = 'adaptive-slide';
       newBg.style.backgroundImage = `url(${thumb})`;
       bgLayer.appendChild(newBg);
       
       // Força o navegador a reconhecer a div antes do fade
       newBg.getBoundingClientRect(); 
       newBg.classList.add('active');

       // Lixeira de memória
       setTimeout(() => {
           const slides = bgLayer.querySelectorAll('.adaptive-slide');
           slides.forEach(s => { if (s !== newBg) s.remove(); });
       }, 1200);
    }

    function updateVideoPlayback(activeIdx) {
      const allSlides = document.querySelectorAll('.slide');
      allSlides.forEach((slide, i) => {
        const vid = slide.querySelector('video');
        if(vid) {
          const vWrap = slide.querySelector('.video-wrapper');
          const playBtn = slide.querySelector('.play-btn');
          
          if(i === activeIdx) {
            vid.play().catch(() => {});
            if(vWrap) vWrap.classList.remove('video-paused');
            if(playBtn) playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;
          } else {
            vid.pause();
            if(vWrap) vWrap.classList.add('video-paused');
            if(playBtn) playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
          }
        }
      });
    }

    function renderDots() {
      dotsContainer.innerHTML = '';
      if (items.length > 1) {
        items.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.onclick = () => {
            const N = items.length;
            let currentMod = ((Math.round(cameraX) % N) + N) % N;
            let diff = i - currentMod;
            if (diff > N/2) diff -= N;
            if (diff < -N/2) diff += N;
            virtualIndex = Math.round(cameraX) + diff;
          };
          dotsContainer.appendChild(dot);
        });
      }
    }

    function updateDotsUI(activeIdx) {
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
          if (i === activeIdx) dot.classList.add('active');
          else dot.classList.remove('active');
      });
    }

    document.getElementById('prevBtn').onclick = () => { if(items.length > 1) virtualIndex--; };
    document.getElementById('nextBtn').onclick = () => { if(items.length > 1) virtualIndex++; };

    const container = document.getElementById('galleryContainer');
    
    let targetRotX = 0, targetRotY = 0;
    let currentRotX = 0, currentRotY = 0;
    let targetZoom = 1, currentZoom = 1;
    let isDragging = false, startMouseX = 0, startMouseY = 0, baseRotX = 0, baseRotY = 0;

    container.addEventListener('wheel', (e) => {
      e.preventDefault(); 
      const zoomSpeed = 0.002;
      targetZoom += e.deltaY * -zoomSpeed;
      targetZoom = Math.min(Math.max(0.5, targetZoom), 3.5); 
    }, { passive: false });

    container.addEventListener('mousedown', (e) => {
      if(e.target.closest('.nav-btn') || e.target.closest('.menu-trigger') || e.target.closest('.custom-trigger') || e.target.closest('.modal-backdrop') || e.target.closest('.video-controls')) return;
      isDragging = true; startMouseX = e.clientX; startMouseY = e.clientY;
      baseRotX = targetRotX; baseRotY = targetRotY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      targetRotY = baseRotY + ((e.clientX - startMouseX) * 0.3);
      targetRotX = baseRotX - ((e.clientY - startMouseY) * 0.3);
    });

    function endDrag() { if(!isDragging) return; isDragging = false; targetRotX = 0; targetRotY = 0; }
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('mouseleave', endDrag);

    function renderPhysics() {
      currentRotX += (targetRotX - currentRotX) * 0.08;
      currentRotY += (targetRotY - currentRotY) * 0.08;
      currentZoom += (targetZoom - currentZoom) * 0.1; 
      cameraX += (virtualIndex - cameraX) * 0.04; 

      const slides = document.querySelectorAll('.slide');
      const N = slides.length;

      if (N > 0) {
        let currentActive = Math.round(cameraX);
        let normalizedActive = ((currentActive % N) + N) % N;

        if (normalizedActive !== lastActiveIndex) {
           lastActiveIndex = normalizedActive;
           updateVideoPlayback(normalizedActive);
           updateDotsUI(normalizedActive);
           updateAdaptiveBg(normalizedActive);
        }

        slides.forEach((slide, i) => {
          let instanceOffset = 0;
          if (N > 1) instanceOffset = Math.round((cameraX - i) / N) * N;
          let actualIndex = i + instanceOffset;
          
          // Culling Extremo (Oculta matematicamente do GPU o que não tá visível)
          let distanceFromCamera = Math.abs(actualIndex - cameraX);
          if (distanceFromCamera > 1.5 && N > 3) {
             slide.style.visibility = 'hidden';
             slide.style.pointerEvents = 'none';
             return; 
          }
          
          slide.style.visibility = 'visible';
          slide.style.pointerEvents = 'auto';

          let spacing = 100 * Math.max(1, currentZoom); 
          let screenX = (actualIndex - cameraX) * spacing; 
          
          slide.style.transform = `translateX(${screenX}vw)`;
          
          const card = slide.querySelector('.card-3d-scene');
          if(card) {
              card.style.transform = `scale(${currentZoom.toFixed(3)}) rotateX(${currentRotX.toFixed(3)}deg) rotateY(${currentRotY.toFixed(3)}deg)`;
          }
        });
      }
      requestAnimationFrame(renderPhysics);
    }
    requestAnimationFrame(renderPhysics);

    const modal = document.getElementById('modalBackdrop');
    document.getElementById('openModalBtn').onclick = () => modal.classList.add('open');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('open');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

    const customModal = document.getElementById('modalCustom');
    document.getElementById('openCustomBtn').onclick = () => customModal.classList.add('open');
    document.getElementById('closeCustomBtn').onclick = () => customModal.classList.remove('open');
    customModal.onclick = (e) => { if (e.target === customModal) customModal.classList.remove('open'); };

    function setBg(type, btn) {
      document.body.className = '';
      bgLayer.innerHTML = ''; // Limpa as divs dinâmicas
      
      if(type !== 'default') {
         document.body.classList.add(`bg-${type}`);
         if (type === 'adaptive') {
            updateAdaptiveBg(lastActiveIndex >= 0 ? lastActiveIndex : 0);
         }
      }
      updateActiveBtn(btn);
    }

    function setBorder(type, btn) {
      container.classList.remove('border-rgb', 'border-gold', 'border-blood', 'border-space', 'border-wave');
      if(type !== 'default') container.classList.add(`border-${type}`);
      updateActiveBtn(btn);
    }

    function updateActiveBtn(btn) {
      const siblings = btn.parentElement.querySelectorAll('.custom-btn');
      siblings.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    const fileInp = document.getElementById('fileInput');
    document.getElementById('uploadDropzone').onclick = () => fileInp.click();
    fileInp.onchange = async (e) => {
      for (const f of Array.from(e.target.files)) await saveMediaItem(f);
      fileInp.value = ''; await loadGallery();
    };

    function renderManageList() {
      const listImages = document.getElementById('list-images-content');
      const listGifs = document.getElementById('list-gifs-content');
      const listVideos = document.getElementById('list-videos-content');
      
      listImages.innerHTML = ''; listGifs.innerHTML = ''; listVideos.innerHTML = '';
      let hasImages = false, hasGifs = false, hasVideos = false;

      items.forEach((item) => {
        const div = document.createElement('div'); div.className = 'media-item';
        
        const isGif = item.name.toLowerCase().endsWith('.gif');
        const isVideo = item.type === 'video';

        // Puxa a thumbnail instantânea (anti-travamento) gerada previamente
        const thumb = document.createElement('img');
        thumb.src = thumbCache[item.id] || ''; 
        thumb.className = 'media-thumb';
        
        const info = document.createElement('div'); info.className = 'media-info'; info.textContent = item.name;
        
        const delBtn = document.createElement('button'); delBtn.className = 'delete-btn';
        delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        delBtn.onclick = async () => { await deleteMediaItem(item.id); await loadGallery(); };
        
        div.append(thumb, info, delBtn); 

        if (isVideo) { listVideos.appendChild(div); hasVideos = true; } 
        else if (isGif) { listGifs.appendChild(div); hasGifs = true; } 
        else { listImages.appendChild(div); hasImages = true; }
      });

      document.getElementById('section-images').style.display = hasImages ? 'block' : 'none';
      document.getElementById('section-gifs').style.display = hasGifs ? 'block' : 'none';
      document.getElementById('section-videos').style.display = hasVideos ? 'block' : 'none';
    }

    loadGallery();
  </script>
</body>
</html>
