<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="cogucat.jpg">
  <title>Notion 3D Media Gallery Pro</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent; /* Permite que os fundos apareçam */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ========================================================
       1. FUNDOS ANIMADOS (GRADIENTES + RUÍDO)
       ======================================================== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 1; /* Elevado para ficar visível */
      background: #111; /* Cor escura padrão */
      transition: opacity 1s ease, background 1s ease;
    }

    /* Gradientes expansivos com animação suave */
    body.bg-aurora .bg-layer {
      background: linear-gradient(-45deg, #0d1117, #1c0936, #002b36, #1c0936);
      background-size: 400% 400%;
      animation: bgGlow 15s ease infinite;
    }
    body.bg-sunset .bg-layer {
      background: linear-gradient(-45deg, #2b0f1a, #821034, #e83a21, #2b0f1a);
      background-size: 400% 400%;
      animation: bgGlow 15s ease infinite;
    }
    body.bg-ocean .bg-layer {
      background: linear-gradient(-45deg, #00101a, #003366, #00a896, #00101a);
      background-size: 400% 400%;
      animation: bgGlow 15s ease infinite;
    }
    body.bg-forest .bg-layer {
      background: linear-gradient(-45deg, #071a12, #11422d, #379667, #071a12);
      background-size: 400% 400%;
      animation: bgGlow 15s ease infinite;
    }
    body.bg-cyber .bg-layer {
      background: linear-gradient(-45deg, #090014, #4a00e0, #ff0055, #090014);
      background-size: 400% 400%;
      animation: bgGlow 15s ease infinite;
    }

    @keyframes bgGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* O Ruído orgânico (Film Grain) que se movimenta */
    .bg-noise {
      position: fixed;
      top: -10%; left: -10%; width: 120%; height: 120%; /* Expande além da tela para evitar tremedeira nas bordas */
      z-index: 2; /* Acima do bg-layer */
      opacity: 0.55; /* Aumentado para mais presença */
      pointer-events: none;
      /* A frequência do ruído (baseFrequency) subiu para 3.5, deixando os pontos minúsculos e muito mais densos */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
      animation: noiseMove 0.8s steps(4) infinite; /* Animação mais lenta e suave */
    }

    @keyframes noiseMove {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1%, -1%); }
      50% { transform: translate(-1%, 1%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(0, 0); }
    }

    /* Container Principal */
    .gallery-container {
      position: relative;
      z-index: 10; /* Protege a galeria acima dos fundos */
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    .slides-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========================================================
       2. ESTRUTURA DO BLOCO 3D (MOLDURA SÓLIDA)
       ======================================================== */
    .card-3d-scene {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: grab;
    }
    .card-3d-scene:active { cursor: grabbing; }

    /* As camadas injetadas por JS para criar o bloco sólido (Metal lateral) */
    #extrusionContainer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .extrusion-layer {
      position: absolute;
      inset: 0;
      border-radius: 26px; /* Acompanha a curva do vidro */
      border: 1px solid rgba(255, 255, 255, 0.04);
      transform-style: preserve-3d;
    }

    /* Tampa traseira do bloco plana e sólida */
    .back-face {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: #0c0c0c; /* Fosco sólido preto */
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform: translateZ(-40px); /* Acompanha a espessura total do bloco */
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      transform-style: preserve-3d;
    }

    /* Painel Frontal (O Vidro) */
    .glass-frame {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px; 
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateZ(0); 
      transform-style: preserve-3d;
      z-index: 10;
    }

    /* ========================================================
       3. BORDA LUMINOSA (NÃO GIRA A CAIXA, SÓ A LUZ)
       ======================================================== */
    .glow-mask {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      padding: 2px; /* Espessura do filete de luz */
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transform: translateZ(1px); /* Cola por cima do vidro */
      z-index: 15;
      overflow: hidden;
    }
    
    .glow-spinner {
      position: absolute;
      top: -100%; left: -100%; width: 300%; height: 300%;
      /* O gradiente é o que gira, correndo por dentro do trilho recortado da mascara */
      background: conic-gradient(transparent 60%, rgba(255,255,255,0.7) 85%, #ffffff 100%);
      animation: spinLight 3s linear infinite;
    }

    @keyframes spinLight {
      100% { transform: rotate(360deg); }
    }

    /* ========================================================
       4. CONTEÚDO (MÍDIA E PLAYERS)
       ======================================================== */
    .media-content {
      max-width: calc(90vw - 32px);
      max-height: calc(85vh - 32px);
      object-fit: contain;
      border-radius: 12px;
      display: block;
      transform: translateZ(2px); /* Fica protegido à frente do fundo */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 30;
      pointer-events: auto;
      backface-visibility: hidden; /* Oculta matematicamente olhando de costas */
    }

    .video-wrapper {
      position: relative;
      display: inline-flex;
      transform: translateZ(2px);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .video-wrapper video {
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    
    /* Play/Pause Central Embutido */
    .pause-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) translateZ(10px) scale(0.8);
      width: 76px; height: 76px;
      background: rgba(15, 15, 15, 0.4);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      color: white; opacity: 0; pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.4, 1), transform 0.3s cubic-bezier(0.2, 0.8, 0.4, 1);
    }
    .video-paused .pause-overlay {
      opacity: 1;
      transform: translate(-50%, -50%) translateZ(25px) scale(1);
    }

    /* Controles do Vídeo (Pílula Apple) */
    .video-controls {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateZ(15px);
      width: calc(100% - 48px); max-width: 460px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(40px) saturate(250%);
      -webkit-backdrop-filter: blur(40px) saturate(250%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 30px; 
      display: flex; align-items: center; gap: 16px;
      padding: 10px 18px; z-index: 60; opacity: 0;
      transition: opacity 0.4s, transform 0.4s;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .video-wrapper:hover .video-controls, .video-paused .video-controls {
      opacity: 1; transform: translateX(-50%) translateZ(35px);
    }
    .control-btn {
      background: none; border: none; color: rgba(255, 255, 255, 0.85);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, transform 0.2s; padding: 0;
    }
    .control-btn:hover { color: #fff; transform: scale(1.1); }
    .progress-bar-container { flex: 1; display: flex; align-items: center; }
    .volume-container { display: flex; align-items: center; gap: 10px; width: 90px; }

    /* Sliders */
    .glass-slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.15); border-radius: 4px;
      outline: none; cursor: pointer; transition: height 0.2s;
    }
    .glass-slider:hover { height: 6px; }
    .glass-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: transform 0.2s; transform: scale(0); 
    }
    .glass-slider:hover::-webkit-slider-thumb, .glass-slider:active::-webkit-slider-thumb { transform: scale(1); }

    .empty-state { padding: 60px 40px; color: rgba(255, 255, 255, 0.6); text-align: center; font-size: 15px; }

    /* ========================================================
       6. CUSTOMIZAÇÃO: CORES DA BORDA
       ======================================================== */
    #card3d.border-neon .glow-spinner {
      background: conic-gradient(transparent 60%, #ff00ff 75%, #00ffff 100%);
    }
    #card3d.border-gold .glow-spinner {
      background: conic-gradient(transparent 60%, #ffd700 75%, #ff8c00 100%);
    }
    #card3d.border-blood .glow-spinner {
      /* Laranja, Vermelho Puro #FF0000 dominante e ponta Branca */
      background: conic-gradient(transparent 50%, #ff8c00 70%, #ff0000 85%, #ff0000 97%, #ffffff 100%);
    }
    #card3d.border-space .glow-spinner {
      background: 
        radial-gradient(circle at 10% 20%, #ffffff 1.5px, transparent 1.5px),
        radial-gradient(circle at 80% 30%, #00ffff 2px, transparent 2px),
        radial-gradient(circle at 40% 70%, #ffffff 1px, transparent 1px),
        radial-gradient(circle at 70% 80%, #ff00ff 2px, transparent 2px),
        conic-gradient(transparent 30%, #090a0f 50%, #2a0845 75%, #6441a5 90%, #00d2ff 100%);
      background-size: 100% 100%;
    }
    #card3d.border-wave .glow-spinner {
      /* Efeito de ondas alternando azul escuro e ciano brilhante */
      background: conic-gradient(
        transparent 30%, 
        #0055ff 45%, 
        #00ffff 60%, 
        #0055ff 75%, 
        #00ffff 90%, 
        #ffffff 100%
      );
    }

    /* ========================================================
       7. MENUS E BOTÕES (UI)
       ======================================================== */
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; cursor: pointer; opacity: 0.2; transition: all 0.3s; z-index: 50;
    }
    .gallery-container:hover .nav-btn { opacity: 0.8; }
    .nav-btn:hover { opacity: 1 !important; background: rgba(255, 255, 255, 0.15); transform: translateY(-50%) scale(1.1); }
    .prev-btn { left: 24px; } .next-btn { right: 24px; }

    .dots-container {
      position: absolute; bottom: 24px; display: flex; gap: 10px; z-index: 50;
      padding: 8px 16px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); border-radius: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: all 0.4s; }
    .dot.active { width: 24px; border-radius: 10px; background: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }

    .menu-trigger {
      position: absolute; top: 24px; right: 24px;
      width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.6); cursor: pointer; opacity: 0.3; transition: all 0.3s; z-index: 60;
    }
    .custom-trigger {
      position: absolute; top: 24px; right: 76px;
      width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.6); cursor: pointer; opacity: 0.3; transition: all 0.3s; z-index: 60;
    }
    .gallery-container:hover .menu-trigger, .menu-trigger:hover, 
    .gallery-container:hover .custom-trigger, .custom-trigger:hover {
      opacity: 1; color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Modais Glassmorphism */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-content {
      width: 440px; background: rgba(25, 25, 25, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 24px; color: #fff; display: flex; flex-direction: column; gap: 16px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
    .close-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    .upload-zone { border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .upload-zone:hover { background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.5); }
    .media-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .media-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; }
    .media-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #000; }
    .media-info { flex: 1; font-size: 13px; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .delete-btn { background: none; border: none; color: #ff4444; padding: 6px; cursor: pointer; }
    .delete-btn:hover { background: rgba(255,0,0,0.1); border-radius: 6px; }

    .custom-section { margin-bottom: 20px; }
    .custom-section h4 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 500; }
    .custom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .custom-btn {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; color: #ccc; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .custom-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .custom-btn.active { background: #fff; color: #000; font-weight: 600; box-shadow: 0 0 10px rgba(255,255,255,0.5); border-color: #fff; }

  </style>
</head>
<body>

  <!-- Camadas de Fundo Animado -->
  <div class="bg-layer"></div>
  <div class="bg-noise"></div>

  <div class="gallery-container" id="galleryContainer">
    
    <!-- Botões de UI -->
    <div class="custom-trigger" id="openCustomBtn" title="Aparência">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
      </svg>
    </div>

    <div class="menu-trigger" id="openModalBtn" title="Gerenciar Mídias">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <div class="nav-btn prev-btn" id="prevBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
    <div class="nav-btn next-btn" id="nextBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>

    <!-- Motor 3D -->
    <div class="slides-wrapper">
      <div class="card-3d-scene" id="card3d">
        
        <!-- Camadas da espessura do bloco (injetadas via JS) -->
        <div id="extrusionContainer"></div>
        
        <!-- Parede Traseira do bloco limpa -->
        <div class="back-face"></div>

        <!-- Frente do bloco -->
        <div class="glass-frame" id="glassFrame">
          <div class="glow-mask">
            <div class="glow-spinner"></div>
          </div>
          <div id="mediaContainer"></div>
        </div>
      </div>
    </div>

    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <!-- Modal Upload -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-weight: 500; font-size: 16px;">Arquivos da Galeria</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="upload-zone" id="uploadDropzone">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none;" />
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto; color: #888;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p>Clique ou arraste imagens e vídeos</p>
      </div>
      <div class="media-list" id="mediaList"></div>
    </div>
  </div>

  <!-- Modal Customização -->
  <div class="modal-backdrop" id="modalCustom">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-weight: 500; font-size: 16px;">Personalizar Aparência</h3>
        <button class="close-btn" id="closeCustomBtn">&times;</button>
      </div>
      <div class="custom-section">
        <h4>Fundos Animados (Ruído)</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBg('default', this)">Escuro</button>
          <button class="custom-btn" onclick="setBg('aurora', this)">Aurora</button>
          <button class="custom-btn" onclick="setBg('sunset', this)">Pôr do Sol</button>
          <button class="custom-btn" onclick="setBg('ocean', this)">Oceano</button>
          <button class="custom-btn" onclick="setBg('forest', this)">Floresta</button>
          <button class="custom-btn" onclick="setBg('cyber', this)">Cyber</button>
        </div>
      </div>
      <div class="custom-section">
        <h4>Cor da Borda de Luz</h4>
        <div class="custom-grid">
          <button class="custom-btn active" onclick="setBorder('default', this)">Branco</button>
          <button class="custom-btn" onclick="setBorder('neon', this)">Neon</button>
          <button class="custom-btn" onclick="setBorder('gold', this)">Ouro</button>
          <button class="custom-btn" onclick="setBorder('blood', this)">Sangue</button>
          <button class="custom-btn" onclick="setBorder('space', this)">Espaço</button>
          <button class="custom-btn" onclick="setBorder('wave', this)">Ondas</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ----------------------------------------------------
       BANCO DE DADOS (IndexedDB)
       ---------------------------------------------------- */
    const DB_NAME = 'NotionSuperGalleryDB_Pro';
    const DB_VERSION = 1;
    const STORE_NAME = 'media';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains(STORE_NAME)) {
            e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveMediaItem(file) {
      const db = await initDB();
      const type = file.type.startsWith('video') ? 'video' : 'image';
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add({ name: file.name, type: type, blob: file, ts: Date.now() });
        tx.oncomplete = () => resolve();
      });
    }

    async function getAllMedia() {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function deleteMediaItem(id) {
      const db = await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    /* ----------------------------------------------------
       GEOMETRIA 3D DA LATERAL DO BLOCO (EXTRUSÃO MACIÇA)
       ---------------------------------------------------- */
    function build3DExtrusion() {
      const container = document.getElementById('extrusionContainer');
      container.innerHTML = '';
      const totalDepth = 40; // 40px de profundidade
      const layersCount = 40; // 1 camada por pixel = 100% sólido sem frestas
      const step = totalDepth / layersCount; 

      for(let i = 1; i <= layersCount; i++) {
        const layer = document.createElement('div');
        layer.className = 'extrusion-layer';
        layer.style.transform = `translateZ(-${i * step}px)`;
        // Sombreamento simulando metal
        const shade = Math.max(15, 35 - (i * 0.5)); 
        layer.style.background = `rgb(${shade}, ${shade}, ${shade})`;
        container.appendChild(layer);
      }
    }
    build3DExtrusion();

    /* ----------------------------------------------------
       LÓGICA DA GALERIA
       ---------------------------------------------------- */
    let items = [], currentIndex = 0, activeURLs = [];
    const mediaContainer = document.getElementById('mediaContainer');
    const dotsContainer = document.getElementById('dotsContainer');

    async function loadGallery() {
      activeURLs.forEach(u => URL.revokeObjectURL(u));
      activeURLs.length = 0;
      items = await getAllMedia();

      if (items.length === 0) {
        currentIndex = 0;
        mediaContainer.innerHTML = `<div class="empty-state">Sem imagens.<br><span>Clique na engrenagem no topo direito.</span></div>`;
      } else {
        if (currentIndex >= items.length) currentIndex = items.length - 1;
        renderSlide();
      }
      renderDots();
      renderManageList();
    }

    function renderSlide() {
      const item = items[currentIndex];
      const url = URL.createObjectURL(item.blob);
      activeURLs.push(url);

      if (item.type === 'video') {
        const wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';
        
        const video = document.createElement('video');
        video.src = url;
        video.className = 'media-content';
        video.autoplay = true; 
        video.loop = true; 
        video.playsInline = true;
        
        const pauseIcon = document.createElement('div');
        pauseIcon.className = 'pause-overlay';
        pauseIcon.innerHTML = `<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        
        const controls = document.createElement('div');
        controls.className = 'video-controls';
        controls.innerHTML = `
          <button class="control-btn play-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <div class="progress-bar-container">
            <input type="range" class="glass-slider progress-slider" min="0" max="100" value="0" />
          </div>
          <div class="volume-container">
            <button class="control-btn mute-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
            <input type="range" class="glass-slider volume-slider" min="0" max="1" step="0.01" value="1" />
          </div>
        `;

        wrapper.appendChild(video);
        wrapper.appendChild(pauseIcon);
        wrapper.appendChild(controls);

        const playBtn = controls.querySelector('.play-btn');
        const progressSlider = controls.querySelector('.progress-slider');
        const muteBtn = controls.querySelector('.mute-btn');
        const volumeSlider = controls.querySelector('.volume-slider');

        controls.addEventListener('mousedown', (e) => e.stopPropagation());
        controls.addEventListener('touchstart', (e) => e.stopPropagation());

        const updateSliderBg = (slider, percent) => {
          slider.style.background = `linear-gradient(to right, rgba(255,255,255,0.95) ${percent}%, rgba(255,255,255,0.15) ${percent}%)`;
        };
        updateSliderBg(volumeSlider, 100);

        const togglePlay = () => {
          if (video.paused) { 
            video.play(); 
            wrapper.classList.remove('video-paused'); 
            playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;
          } else { 
            video.pause(); 
            wrapper.classList.add('video-paused'); 
            playBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
          }
        };

        wrapper.onclick = (e) => { e.stopPropagation(); togglePlay(); };
        playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };

        video.ontimeupdate = () => {
          if (!video.duration) return;
          const percentage = (video.currentTime / video.duration) * 100;
          progressSlider.value = percentage;
          updateSliderBg(progressSlider, percentage);
        };
        progressSlider.oninput = (e) => {
          if (!video.duration) return;
          const val = e.target.value;
          video.currentTime = (val / 100) * video.duration;
          updateSliderBg(progressSlider, val);
        };

        const updateMuteIcon = () => {
          if (video.muted || video.volume === 0) {
            muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
          } else {
            muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
          }
        };
        volumeSlider.oninput = (e) => {
          const val = e.target.value;
          video.volume = val;
          video.muted = val === '0';
          updateSliderBg(volumeSlider, val * 100);
          updateMuteIcon();
        };
        muteBtn.onclick = (e) => {
          e.stopPropagation();
          video.muted = !video.muted;
          if (!video.muted && video.volume === 0) {
            video.volume = 1;
            volumeSlider.value = 1;
            updateSliderBg(volumeSlider, 100);
          } else {
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateSliderBg(volumeSlider, video.muted ? 0 : video.volume * 100);
          }
          updateMuteIcon();
        };

        // Previne flashes dimensionais esperando o vídeo carregar primeiro
        video.onloadedmetadata = () => {
          mediaContainer.innerHTML = '';
          mediaContainer.appendChild(wrapper);
        };
      } else {
        const img = document.createElement('img');
        img.src = url; img.className = 'media-content'; img.draggable = false;
        
        img.onload = () => {
          mediaContainer.innerHTML = '';
          mediaContainer.appendChild(img);
        };
      }
    }

    function renderDots() {
      dotsContainer.innerHTML = '';
      if (items.length > 1) {
        items.forEach((_, idx) => {
          const dot = document.createElement('div');
          dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
          dot.onclick = () => { currentIndex = idx; renderSlide(); renderDots(); };
          dotsContainer.appendChild(dot);
        });
      }
    }

    document.getElementById('prevBtn').onclick = () => { if(items.length > 1) { currentIndex = (currentIndex - 1 + items.length) % items.length; renderSlide(); renderDots(); }};
    document.getElementById('nextBtn').onclick = () => { if(items.length > 1) { currentIndex = (currentIndex + 1) % items.length; renderSlide(); renderDots(); }};

    /* ----------------------------------------------------
       FÍSICA 3D (MOLA LENTA + ARRASTO DO MOUSE)
       ---------------------------------------------------- */
    const card = document.getElementById('card3d');
    const container = document.getElementById('galleryContainer');
    
    let targetRotX = 0, targetRotY = 0;
    let currentRotX = 0, currentRotY = 0;
    let velX = 0, velY = 0;
    
    let isDragging = false;
    let startMouseX = 0, startMouseY = 0;
    let baseRotX = 0, baseRotY = 0;

    container.addEventListener('mousedown', (e) => {
      // Impede girar a tela ao clicar nos botões ou modais
      if(e.target.closest('.nav-btn') || e.target.closest('.menu-trigger') || e.target.closest('.custom-trigger') || e.target.closest('.modal-backdrop')) return;
      isDragging = true;
      startMouseX = e.clientX;
      startMouseY = e.clientY;
      baseRotX = targetRotX; 
      baseRotY = targetRotY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      let deltaX = e.clientX - startMouseX;
      let deltaY = e.clientY - startMouseY;
      
      // Sensibilidade ideal e gira livre 360
      targetRotY = baseRotY + (deltaX * 0.3);
      targetRotX = baseRotX - (deltaY * 0.3);
    });

    function endDrag() {
      if(!isDragging) return;
      isDragging = false;
      targetRotX = 0;
      targetRotY = 0;
    }
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('mouseleave', endDrag);

    // Motor da Mola: Lenta, Suave e Firme
    function renderPhysics() {
      const tension = 0.015; // Quase nenhuma força elástica, volta bem flutuante
      const friction = 0.55; // Forte amortecimento (água), impede que fique quicando

      velX += (targetRotX - currentRotX) * tension;
      velY += (targetRotY - currentRotY) * tension;
      velX *= friction;
      velY *= friction;

      currentRotX += velX;
      currentRotY += velY;

      card.style.transform = `rotateX(${currentRotX.toFixed(3)}deg) rotateY(${currentRotY.toFixed(3)}deg)`;
      requestAnimationFrame(renderPhysics);
    }
    requestAnimationFrame(renderPhysics);


    /* ----------------------------------------------------
       LÓGICA DOS MODAIS (UPLOAD E CUSTOMIZAÇÃO)
       ---------------------------------------------------- */
    const modal = document.getElementById('modalBackdrop');
    document.getElementById('openModalBtn').onclick = () => modal.classList.add('open');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('open');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

    const customModal = document.getElementById('modalCustom');
    document.getElementById('openCustomBtn').onclick = () => customModal.classList.add('open');
    document.getElementById('closeCustomBtn').onclick = () => customModal.classList.remove('open');
    customModal.onclick = (e) => { if (e.target === customModal) customModal.classList.remove('open'); };

    // Fundos Animados
    function setBg(type, btn) {
      document.body.className = '';
      if(type !== 'default') document.body.classList.add(`bg-${type}`);
      updateActiveBtn(btn);
    }

    // Cores da Borda
    function setBorder(type, btn) {
      // Agora remove todas as classes corretamente para evitar que travem
      card.classList.remove('border-neon', 'border-gold', 'border-blood', 'border-space', 'border-wave');
      if(type !== 'default') card.classList.add(`border-${type}`);
      updateActiveBtn(btn);
    }

    function updateActiveBtn(btn) {
      const siblings = btn.parentElement.querySelectorAll('.custom-btn');
      siblings.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    const fileInp = document.getElementById('fileInput');
    document.getElementById('uploadDropzone').onclick = () => fileInp.click();
    fileInp.onchange = async (e) => {
      for (const f of Array.from(e.target.files)) await saveMediaItem(f);
      fileInp.value = ''; await loadGallery();
    };

    function renderManageList() {
      const list = document.getElementById('mediaList'); list.innerHTML = '';
      items.forEach((item, idx) => {
        const div = document.createElement('div'); div.className = 'media-item';
        
        const thumb = item.type === 'video' ? document.createElement('video') : document.createElement('img');
        thumb.src = URL.createObjectURL(item.blob); thumb.className = 'media-thumb';
        
        const info = document.createElement('div'); info.className = 'media-info'; info.textContent = `${idx + 1}. ${item.name}`;
        
        const delBtn = document.createElement('button'); delBtn.className = 'delete-btn';
        delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        delBtn.onclick = async () => { await deleteMediaItem(item.id); await loadGallery(); };
        
        div.append(thumb, info, delBtn); list.appendChild(div);
      });
    }

    loadGallery();
  </script>
</body>
